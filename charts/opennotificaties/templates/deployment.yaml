# Deployment Beat

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opennotificaties.beatFullname" . }}
  labels:
  {{- include "opennotificaties.beatLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.beat.replicaCount }}
  selector:
    matchLabels:
      {{- include "opennotificaties.beatSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
    {{- include "opennotificaties.beatSelectorLabels" . | nindent 8 }}
    {{- with .Values.beat.podLabels }}
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "opennotificaties.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "opennotificaties.beatFullname" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.extraEnvVars }}
            {{- include "opennotificaties.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (include "opennotificaties.fullname" .) }}
            - configMapRef:
                name: {{ include "opennotificaties.fullname" . }}
          resources:
            {{- toYaml .Values.beat.resources | nindent 12 }}
          command:
            - /celery_beat.sh
          volumeMounts:
            - name: media
              mountPath: /app/media
              subPath: {{ .Values.persistence.mediaMountSubpath  | default "opennotificaties/media" }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "opennotificaties.tplvalues.render" ( dict "value" .Values.extraVolumeMounts "context" $ ) | nindent 12 }}
            {{- end }}
          {{- if .Values.beat.probesEnabled }}
          startupProbe:
            exec: 
              command:
              - /bin/sh
              - -c
              - maykin-common beat-health-check --file=/app/tmp/celery_beat.live --max-age=600
            initialDelaySeconds: {{ .Values.beat.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.beat.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.beat.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.beat.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.beat.startupProbe.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - maykin-common beat-health-check --file=/app/tmp/celery_beat.live --max-age=120
            initialDelaySeconds: {{ .Values.beat.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.beat.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.beat.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.beat.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.beat.livenessProbe.failureThreshold }}
          {{- end }}
      volumes:
        - name: media
          persistentVolumeClaim:
          {{- if .Values.persistence.enabled }}
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{- else }}{{ include "opennotificaties.fullname" . }}{{- end }}
          {{- else }}
          emptyDir: { }
          {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "opennotificaties.tplvalues.render" ( dict "value" .Values.extraVolumes "context" $ ) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

