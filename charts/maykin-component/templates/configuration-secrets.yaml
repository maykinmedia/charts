{{- if and (not .Values.existingConfigurationSecret) .Values.global.configuration.enabled .Values.configuration.enabled}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.configurationSecretsName | default (printf "%s-config-secret" (include "application.fullname" .)) }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
stringData:
  {{- if .Values.global.configuration.secrets }}
  {{- include "application.tplvalues.render" ( dict "value" .Values.global.configuration.secrets "context" $ ) | nindent 4 }}
  {{- else }}
  {{- include "application.tplvalues.render" ( dict "value" .Values.configuration.secrets "context" $ ) | nindent 4 }}
  {{- end }}
{{- end }}
