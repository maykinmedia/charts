apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "application.fullname" . }}
  namespace: {{ template "application.namespace" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
    {{- if .Values.configMap.additionalLabels }}
    {{- toYaml .Values.configMap.additionalLabels | nindent 4 }}
    {{- end }}
  {{- if .Values.configMap.annotations }}
  annotations:
    {{- toYaml .Values.configMap.annotations | nindent 4 }}
  {{- end }}
data:
  {{/* Django core settings */}}
  DJANGO_SETTINGS_MODULE: {{ .Values.settings.djangoSettingsModule | default (printf "%s.conf.docker" (include "application.name" .)) | quote }}
  {{- if .Values.settings.useXForwardedHost }}
  USE_X_FORWARDED_HOST: "True"
  {{- end }}
  ENVIRONMENT: {{ .Values.settings.environment | default (include "application.fullname" .) | quote }}
  ALLOWED_HOSTS: "{{ include "application.fullname" . }},{{ include "application.fullname" . }}.{{ .Release.Namespace }},{{ .Values.settings.allowedHosts | replace " " "" | toString }}"

  {{/* Redis host for cache and celery */}}
  {{- $redisHost := "" }}
  {{- if .Values.tags.redis }}
  {{- $redisHost = printf "%s-master.%s" (include "common.names.fullname" .Subcharts.redis) .Release.Namespace }}
  {{- end }}

  {{/* Cache: use the Redis subchart if enabled, otherwise the explicit values */}}
  {{- if .Values.tags.redis }}
  CACHE_DEFAULT: {{ printf "%s:6379/0" $redisHost | quote }}
  CACHE_AXES: {{ printf "%s:6379/0" $redisHost | quote }}
  CACHE_OIDC: {{ printf "%s:6379/0" $redisHost | quote }}
  {{- else }}
  CACHE_DEFAULT: {{ .Values.settings.cache.default | toString | quote }}
  CACHE_AXES: {{ .Values.settings.cache.axes | toString | quote }}
  CACHE_OIDC: {{ .Values.settings.cache.oidc | toString | quote }}
  {{- end }}

  {{/* Celery: broker/backend (Redis subchart or explicit values) */}}
  {{- if .Values.tags.redis }}
  CELERY_BROKER_URL: {{ printf "redis://%s:6379/1" $redisHost | quote }}
  CELERY_RESULT_BACKEND: {{ printf "redis://%s:6379/1" $redisHost | quote }}
  {{- else }}
  CELERY_BROKER_URL: {{ .Values.settings.celery.brokerUrl | toString | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.settings.celery.resultBackend | toString | quote }}
  {{- end }}
  {{- if .Values.settings.celery.logLevel }}
  CELERY_LOGLEVEL: {{ .Values.settings.celery.logLevel | upper | toString | quote }}
  {{- end }}
  {{- if .Values.settings.celery.resultExpires }}
  CELERY_RESULT_EXPIRES: {{ .Values.settings.celery.resultExpires | toString | quote }}
  {{- end }}
  {{- if .Values.worker.maxWorkerLivenessDelta }}
  MAX_WORKER_LIVENESS_DELTA: {{ .Values.worker.maxWorkerLivenessDelta | toString | quote }}
  {{- end }}

  {{/* Application logging */}}
  {{- if .Values.settings.logging.level }}
  LOG_LEVEL: {{ .Values.settings.logging.level | toString | quote }}
  {{- end }}
  {{- if .Values.settings.logging.requests }}
  LOG_REQUESTS: "True"
  {{- end }}
  {{- if .Values.settings.logging.outgoingRequests }}
  LOG_OUTGOING_REQUESTS: "True"
  {{- end }}
  {{- if .Values.settings.logging.outgoingRequestsDBSave }}
  LOG_OUTGOING_REQUESTS_DB_SAVE: "True"
  {{- end }}
  {{- if .Values.settings.logging.outgoingRequestsDBSaveBody }}
  LOG_OUTGOING_REQUESTS_DB_SAVE_BODY: "True"
  {{- end }}
  {{- if ne .Values.settings.logging.outgoingRequestsResetDBSaveAfter nil }}
  LOG_OUTGOING_REQUESTS_RESET_DB_SAVE_AFTER: {{ int .Values.settings.logging.outgoingRequestsResetDBSaveAfter | quote }}
  {{- end }}
  {{- if ne .Values.settings.logging.outgoingRequestsMaxAge nil }}
  LOG_OUTGOING_REQUESTS_MAX_AGE: {{ int .Values.settings.logging.outgoingRequestsMaxAge | quote }}
  {{- end }}

  {{/* Database connection and connection pooling */}}
  DB_NAME: {{ .Values.settings.database.name | toString | quote }}
  DB_HOST: {{ .Values.global.settings.databaseHost | default .Values.settings.database.host | toString | quote }}
  DB_USER: {{ .Values.settings.database.username | toString | quote }}
  DB_PORT: {{ .Values.settings.database.port | toString | quote }}
  PGSSLMODE: {{ .Values.settings.database.sslmode | toString | quote }}
  {{- with .Values.settings.database.db_pool }}
  {{- if .enabled }}
  DB_POOL_ENABLED: {{ .enabled | toString | title | quote }}
  {{- if ne .db_pool_min_size nil }}
  DB_POOL_MIN_SIZE: {{ int .db_pool_min_size | quote }}
  {{- end }}
  {{- if ne .db_pool_max_size nil }}
  DB_POOL_MAX_SIZE: {{ int .db_pool_max_size | quote }}
  {{- end }}
  {{- if ne .db_pool_timeout nil }}
  DB_POOL_TIMEOUT: {{ int .db_pool_timeout | quote }}
  {{- end }}
  {{- if ne .db_pool_max_waiting nil }}
  DB_POOL_MAX_WAITING: {{ int .db_pool_max_waiting | quote }}
  {{- end }}
  {{- if ne .db_pool_max_lifetime nil }}
  DB_POOL_MAX_LIFETIME: {{ int .db_pool_max_lifetime | quote }}
  {{- end }}
  {{- if ne .db_pool_max_idle nil }}
  DB_POOL_MAX_IDLE: {{ int .db_pool_max_idle | quote }}
  {{- end }}
  {{- if ne .db_pool_reconnect_timeout nil }}
  DB_POOL_RECONNECT_TIMEOUT: {{ int .db_pool_reconnect_timeout | quote }}
  {{- end }}
  {{- if ne .db_pool_num_workers nil }}
  DB_POOL_NUM_WORKERS: {{ int .db_pool_num_workers | quote }}
  {{- end }}
  {{- else }}
  {{- if ne $.Values.settings.database.db_conn_max_age nil }}
  DB_CONN_MAX_AGE: {{ int $.Values.settings.database.db_conn_max_age | quote }}
  {{- end }}
  {{- end }}
  {{- end }}

  {{/* Debug and security flags */}}
  {{- if .Values.settings.debug }}
  DEBUG: "True"
  {{- end }}
  {{- if .Values.settings.disable2fa }}
  DISABLE_2FA: "True"
  {{- end }}
  IS_HTTPS: {{ if .Values.settings.isHttps }}"True"{{ else }}"False"{{ end }}

  {{/* Email */}}
  EMAIL_HOST: {{ .Values.settings.email.host | toString | quote }}
  EMAIL_PORT: {{ .Values.settings.email.port | toString | quote }}
  {{- if .Values.settings.email.username }}
  EMAIL_HOST_USER: {{ .Values.settings.email.username | toString | quote }}
  {{- end }}
  {{- if .Values.settings.email.useTLS }}
  EMAIL_USE_TLS: "True"
  {{- end }}
  {{- if .Values.settings.email.defaultFrom }}
  DEFAULT_FROM_EMAIL: {{ .Values.settings.email.defaultFrom | toString | quote }}
  {{- end }}

  {{/* Elastic APM */}}
  {{- if .Values.settings.elasticapm.url }}
  ELASTIC_APM_SERVICE_NAME: {{ .Values.settings.elasticapm.serviceName | toString | quote }}
  {{- end }}

  {{/* uWSGI tuning */}}
  {{- if .Values.settings.uwsgi.master }}
  UWSGI_MASTER: "1"
  {{- end }}
  {{- if .Values.settings.uwsgi.threads }}
  UWSGI_THREADS: {{ .Values.settings.uwsgi.threads | toString | quote }}
  {{- end }}
  {{- if .Values.settings.uwsgi.processes }}
  UWSGI_PROCESSES: {{ .Values.settings.uwsgi.processes | toString | quote }}
  {{- end }}
  {{- if .Values.settings.uwsgi.maxRequests }}
  UWSGI_MAX_REQUESTS: {{ .Values.settings.uwsgi.maxRequests | toString | quote }}
  {{- end }}
  {{- if .Values.settings.uwsgi.harakiri }}
  UWSGI_HARAKIRI: {{ .Values.settings.uwsgi.harakiri | toString | quote }}
  {{- end }}

  {{/* Notifications */}}
  {{- if .Values.settings.notifications.disabled }}
  NOTIFICATIONS_DISABLED: "True"
  {{- end }}
  {{- if .Values.settings.notifications.logInDb }}
  LOG_NOTIFICATIONS_IN_DB: "True"
  {{- end }}
  {{- if ne .Values.settings.notifications.numberOfDaysRetained nil }}
  NOTIFICATION_NUMBER_OF_DAYS_RETAINED: {{ int .Values.settings.notifications.numberOfDaysRetained | quote }}
  {{- end }}
  {{- if .Values.settings.notifications.source }}
  NOTIFICATIONS_SOURCE: {{ .Values.settings.notifications.source | toString | quote }}
  {{- end }}
  
  {{/* Application core settings */}}
  {{- if .Values.settings.siteDomain }}
  SITE_DOMAIN: {{ .Values.settings.siteDomain | toString | quote }}
  {{- end }}
  
  {{/* OpenTelemetry */}}
  {{- if .Values.settings.otel.disabled }}
  OTEL_SDK_DISABLED: "True"
  {{- else }}
  {{- if .Values.settings.otel.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: "{{ range $index, $item := .Values.settings.otel.resourceAttributes }}{{ if $index }},{{ end }}{{ $item.key }}={{ $item.value }}{{ end }}"
  {{- end }}
  {{- if .Values.settings.otel.exporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.settings.otel.exporterOtlpEndpoint | toString | quote }}
  {{- end }}
  {{- if .Values.settings.otel.exporterOtlpMetricsInsecure }}
  OTEL_EXPORTER_OTLP_METRICS_INSECURE: "True"
  {{- end }}
  {{- if .Values.settings.otel.exporterOtlpProtocol }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.settings.otel.exporterOtlpProtocol | toString | quote }}
  {{- end }}
  {{- if .Values.settings.otel.metricExportInterval }}
  OTEL_METRIC_EXPORT_INTERVAL: {{ .Values.settings.otel.metricExportInterval | toString | quote }}
  {{- end }}
  {{- if .Values.settings.otel.metricExportTimeout }}
  OTEL_METRIC_EXPORT_TIMEOUT: {{ .Values.settings.otel.metricExportTimeout | toString | quote }}
  {{- end }}
  {{- end }}

  {{/* Extra application-specific settings, injected by charts that extend this generic one */}}
  {{- if .Values.settings.extraSettings }}
  {{- include "application.tplvalues.render" ( dict "value" .Values.settings.extraSettings "context" $ ) | nindent 2 }}
  {{- end }}
