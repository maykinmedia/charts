apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "application.fullname" . }}
  namespace: {{ template "application.namespace" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
    {{- if .Values.configMap.additionalLabels }}
    {{- toYaml .Values.configMap.additionalLabels | nindent 4 }}
    {{- end }}
  {{- if .Values.configMap.annotations }}
  annotations:
    {{- toYaml .Values.configMap.annotations | nindent 4 }}
  {{- end }}
data:
  {{- /* Django core settings */}}
  DJANGO_SETTINGS_MODULE: {{ .Values.settings.djangoSettingsModule | default (printf "%s.conf.docker" (include "application.name" .)) | quote }}
  {{- with include "application.boolValue" .Values.settings.useXForwardedHost }}
  USE_X_FORWARDED_HOST: {{ . | quote }}
  {{- end }}
  ENVIRONMENT: {{ .Values.settings.environment | default (include "application.fullname" .) | quote }}
  {{- $allowedHosts := list (include "application.fullname" .) (printf "%s.%s" (include "application.fullname" .) .Release.Namespace) }}
  {{- with .Values.settings.allowedHosts }}
  {{- $allowedHosts = append $allowedHosts (toString . | replace " " "") }}
  {{- end }}
  ALLOWED_HOSTS: {{ join "," $allowedHosts | quote }}

  {{- /* Redis host for cache and celery */}}
  {{- $redisHost := "" }}
  {{- if .Values.tags.redis }}
  {{- $redisHost = printf "%s-master.%s" (include "common.names.fullname" .Subcharts.redis) .Release.Namespace }}
  {{- end }}

  {{- /* Cache: use the Redis subchart if enabled, otherwise the explicit values */}}
  {{- if .Values.tags.redis }}
  CACHE_DEFAULT: {{ printf "%s:6379/0" $redisHost | quote }}
  CACHE_AXES: {{ printf "%s:6379/0" $redisHost | quote }}
  CACHE_OIDC: {{ printf "%s:6379/0" $redisHost | quote }}
  {{- else }}
  {{- with .Values.settings.cache.default }}
  CACHE_DEFAULT: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.cache.axes }}
  CACHE_AXES: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.cache.oidc }}
  CACHE_OIDC: {{ . | toString | quote }}
  {{- end }}
  {{- end }}

  {{- /* Celery: broker/backend (Redis subchart or explicit values) */}}
  {{- if .Values.tags.redis }}
  CELERY_BROKER_URL: {{ printf "redis://%s:6379/1" $redisHost | quote }}
  CELERY_RESULT_BACKEND: {{ printf "redis://%s:6379/1" $redisHost | quote }}
  {{- else }}
  {{- with .Values.settings.celery.brokerUrl }}
  CELERY_BROKER_URL: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.celery.resultBackend }}
  CELERY_RESULT_BACKEND: {{ . | toString | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.settings.celery.logLevel }}
  CELERY_LOGLEVEL: {{ . | toString | upper | quote }}
  {{- end }}
  {{- with .Values.settings.celery.resultExpires }}
  CELERY_RESULT_EXPIRES: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.worker.maxWorkerLivenessDelta }}
  MAX_WORKER_LIVENESS_DELTA: {{ . | toString | quote }}
  {{- end }}

  {{- /* Application logging */}}
  {{- with .Values.settings.logging.level }}
  LOG_LEVEL: {{ . | toString | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.logging.requests }}
  LOG_REQUESTS: {{ . | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.logging.outgoingRequests }}
  LOG_OUTGOING_REQUESTS: {{ . | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.logging.outgoingRequestsDBSave }}
  LOG_OUTGOING_REQUESTS_DB_SAVE: {{ . | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.logging.outgoingRequestsDBSaveBody }}
  LOG_OUTGOING_REQUESTS_DB_SAVE_BODY: {{ . | quote }}
  {{- end }}
  {{- if ne .Values.settings.logging.outgoingRequestsResetDBSaveAfter nil }}
  LOG_OUTGOING_REQUESTS_RESET_DB_SAVE_AFTER: {{ int .Values.settings.logging.outgoingRequestsResetDBSaveAfter | quote }}
  {{- end }}
  {{- if ne .Values.settings.logging.outgoingRequestsMaxAge nil }}
  LOG_OUTGOING_REQUESTS_MAX_AGE: {{ int .Values.settings.logging.outgoingRequestsMaxAge | quote }}
  {{- end }}

  {{- /* Database connection */}}
  {{- with .Values.settings.database.name }}
  DB_NAME: {{ . | toString | quote }}
  {{- end }}
  {{- $dbHost := dig "settings" "databaseHost" "" (.Values.global | default dict) | default .Values.settings.database.host }}
  {{- with $dbHost }}
  DB_HOST: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.database.username }}
  DB_USER: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.database.port }}
  DB_PORT: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.database.sslmode }}
  PGSSLMODE: {{ . | toString | quote }}
  {{- end }}

  {{- /* Database connection pooling (pool and DB_CONN_MAX_AGE are mutually exclusive) */}}
  {{- $pool := .Values.settings.database.db_pool | default dict }}
  {{- $poolEnabled := include "application.boolValue" $pool.enabled }}
  {{- with $poolEnabled }}
  DB_POOL_ENABLED: {{ . | quote }}
  {{- end }}
  {{- if eq $poolEnabled "True" }}
  {{- if ne $pool.db_pool_min_size nil }}
  DB_POOL_MIN_SIZE: {{ int $pool.db_pool_min_size | quote }}
  {{- end }}
  {{- if ne $pool.db_pool_max_size nil }}
  DB_POOL_MAX_SIZE: {{ int $pool.db_pool_max_size | quote }}
  {{- end }}
  {{- if ne $pool.db_pool_timeout nil }}
  DB_POOL_TIMEOUT: {{ int $pool.db_pool_timeout | quote }}
  {{- end }}
  {{- if ne $pool.db_pool_max_waiting nil }}
  DB_POOL_MAX_WAITING: {{ int $pool.db_pool_max_waiting | quote }}
  {{- end }}
  {{- if ne $pool.db_pool_max_lifetime nil }}
  DB_POOL_MAX_LIFETIME: {{ int $pool.db_pool_max_lifetime | quote }}
  {{- end }}
  {{- if ne $pool.db_pool_max_idle nil }}
  DB_POOL_MAX_IDLE: {{ int $pool.db_pool_max_idle | quote }}
  {{- end }}
  {{- if ne $pool.db_pool_reconnect_timeout nil }}
  DB_POOL_RECONNECT_TIMEOUT: {{ int $pool.db_pool_reconnect_timeout | quote }}
  {{- end }}
  {{- if ne $pool.db_pool_num_workers nil }}
  DB_POOL_NUM_WORKERS: {{ int $pool.db_pool_num_workers | quote }}
  {{- end }}
  {{- else if ne .Values.settings.database.db_conn_max_age nil }}
  DB_CONN_MAX_AGE: {{ int .Values.settings.database.db_conn_max_age | quote }}
  {{- end }}

  {{- /* Debug and security flags */}}
  {{- with include "application.boolValue" .Values.settings.debug }}
  DEBUG: {{ . | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.disable2fa }}
  DISABLE_2FA: {{ . | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.isHttps }}
  IS_HTTPS: {{ . | quote }}
  {{- end }}

  {{- /* Email */}}
  {{- with .Values.settings.email.host }}
  EMAIL_HOST: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.email.port }}
  EMAIL_PORT: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.email.username }}
  EMAIL_HOST_USER: {{ . | toString | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.email.useTLS }}
  EMAIL_USE_TLS: {{ . | quote }}
  {{- end }}
  {{- with .Values.settings.email.defaultFrom }}
  DEFAULT_FROM_EMAIL: {{ . | toString | quote }}
  {{- end }}

  {{- /* Elastic APM */}}
  {{- if .Values.settings.elasticapm.url }}
  {{- with .Values.settings.elasticapm.serviceName }}
  ELASTIC_APM_SERVICE_NAME: {{ . | toString | quote }}
  {{- end }}
  {{- end }}

  {{- /* uWSGI tuning: only emitted when set, otherwise /uwsgi.ini applies */}}
  {{- with .Values.settings.uwsgi.master }}
  UWSGI_MASTER: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.uwsgi.threads }}
  UWSGI_THREADS: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.uwsgi.processes }}
  UWSGI_PROCESSES: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.uwsgi.maxRequests }}
  UWSGI_MAX_REQUESTS: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.uwsgi.harakiri }}
  UWSGI_HARAKIRI: {{ . | toString | quote }}
  {{- end }}

  {{- /* Notifications */}}
  {{- with include "application.boolValue" .Values.settings.notifications.disabled }}
  NOTIFICATIONS_DISABLED: {{ . | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.notifications.logInDb }}
  LOG_NOTIFICATIONS_IN_DB: {{ . | quote }}
  {{- end }}
  {{- if ne .Values.settings.notifications.numberOfDaysRetained nil }}
  NOTIFICATION_NUMBER_OF_DAYS_RETAINED: {{ int .Values.settings.notifications.numberOfDaysRetained | quote }}
  {{- end }}
  {{- with .Values.settings.notifications.source }}
  NOTIFICATIONS_SOURCE: {{ . | toString | quote }}
  {{- end }}

  {{- /* Application core settings */}}
  {{- with .Values.settings.siteDomain }}
  SITE_DOMAIN: {{ . | toString | quote }}
  {{- end }}

  {{- /* OpenTelemetry */}}
  {{- $otelDisabled := include "application.boolValue" .Values.settings.otel.disabled }}
  {{- with $otelDisabled }}
  OTEL_SDK_DISABLED: {{ . | quote }}
  {{- end }}
  {{- if ne $otelDisabled "True" }}
  {{- with .Values.settings.otel.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: "{{ range $index, $item := . }}{{ if $index }},{{ end }}{{ $item.key }}={{ $item.value }}{{ end }}"
  {{- end }}
  {{- with .Values.settings.otel.exporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | toString | quote }}
  {{- end }}
  {{- with include "application.boolValue" .Values.settings.otel.exporterOtlpMetricsInsecure }}
  OTEL_EXPORTER_OTLP_METRICS_INSECURE: {{ . | quote }}
  {{- end }}
  {{- with .Values.settings.otel.exporterOtlpProtocol }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.otel.metricExportInterval }}
  OTEL_METRIC_EXPORT_INTERVAL: {{ . | toString | quote }}
  {{- end }}
  {{- with .Values.settings.otel.metricExportTimeout }}
  OTEL_METRIC_EXPORT_TIMEOUT: {{ . | toString | quote }}
  {{- end }}
  {{- end }}

  {{- /* Extra application-specific settings, injected by charts that extend this generic one */}}
  {{- if .Values.settings.extraSettings }}
  {{- include "application.tplvalues.render" ( dict "value" .Values.settings.extraSettings "context" $ ) | nindent 2 }}
  {{- end }}
