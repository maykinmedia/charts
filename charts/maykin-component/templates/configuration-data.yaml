{{- if and .Values.global.configuration.enabled .Values.configuration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "application.fullname" . }}-configuration
  labels:
    {{- include "application.labels" . | nindent 4 }}
data:
  configuration.yaml: |-
    {{- include "application.tplvalues.render" (dict "value" .Values.configuration.data "context" $) | nindent 4 }}
{{- end }}
