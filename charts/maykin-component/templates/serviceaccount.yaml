{{- if .Values.serviceAccount.create }}
{{- $automount := .Values.serviceAccount.automountServiceAccountToken }}
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: {{ if kindIs "invalid" $automount }}true{{ else }}{{ $automount }}{{ end }}
metadata:
  name: {{ include "application.serviceAccountName" . }}
  namespace: {{ template "application.namespace" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
    {{- if .Values.serviceAccount.additionalLabels }}
    {{- toYaml .Values.serviceAccount.additionalLabels | nindent 4 }}
    {{- end }}
  {{- if .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}
