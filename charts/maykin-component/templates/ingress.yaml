{{- if .Values.ingress.enabled -}}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ include "application.fullname" . }}
  namespace: {{ template "application.namespace" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
    {{- if .Values.ingress.additionalLabels }}
    {{- toYaml .Values.ingress.additionalLabels | nindent 4 }}
    {{- end }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
  - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ include "application.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
              {{- else }}
              serviceName: {{ include "application.fullname" $ }}
              servicePort: {{ $.Values.service.port }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

{{- if .Values.extraIngress }}
{{- range $key, $value := .Values.extraIngress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $value.name }}
  namespace: {{ template "application.namespace" $ }}
  labels:
    {{- include "application.labels" $ | nindent 4 }}
  {{- if $value.annotations }}
  annotations:
    {{- range $annKey, $annValue := $value.annotations }}
    {{ $annKey }}: {{ $annValue | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if $value.className }}
  ingressClassName: {{ $value.className }}
  {{- end }}
  {{- if $value.tls }}
  tls:
    {{- range $tlsEntry := $value.tls }}
    - hosts:
        {{- range $host := $tlsEntry.hosts }}
        - {{ $host }}
        {{- end }}
      secretName: {{ $tlsEntry.secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $hostEntry := $value.hosts }}
    - host: {{ $hostEntry.host }}
      http:
        paths:
          {{- range $pathEntry := $hostEntry.paths }}
          - path: {{ $pathEntry.path }}
            {{- if $pathEntry.pathType }}
            pathType: {{ $pathEntry.pathType }}
            {{- end }}
            backend:
              service:
                name: {{ $pathEntry.servicename }}
                port:
                  number: {{ $pathEntry.portNumber }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
